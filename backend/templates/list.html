<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上架 - LARP 二手市集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg-deep: #110e0a; --bg-card: #1c1610; --amber: #c8831a; --blood: #7a2020; --parchment: #e8dcc4; --iron: #8a7a6a; }
  body { background: var(--bg-deep); color: var(--parchment); font-family: 'Lora', serif; }
  h1,.title { font-family: 'Cinzel', serif; }
  .amber { color: var(--amber); }
  .blood { background: var(--blood); }
  .btn-primary { background: var(--amber); color: #000; }
  .btn-primary:hover { background: #e09520; }
  .card { background: var(--bg-card); border: 1px solid #2a2018; }
  .text-iron { color: var(--iron); }
  input, select, textarea { background: #0d0b08; border: 1px solid #3a2a1a; color: var(--parchment); border-radius: 6px; padding: 8px 12px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--amber); }
  label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--iron); }
  .field { margin-bottom: 16px; }
</style>
</head>
<body class="min-h-screen">
<nav class="border-b border-amber/30 bg-[#0d0b08] px-6 py-4 flex items-center justify-between">
  <a href="/" class="title text-xl font-bold amber">⚔ LARP 二手市集</a>
  <div class="flex gap-5 text-sm text-iron">
    <a href="/market" class="hover:text-amber">市集</a>
    <a href="/wishlist" class="hover:text-amber">許願區</a>
    <a href="/list" class="text-amber">上架</a>
    <a href="/about" class="hover:text-amber">關於</a>
  </div>
</nav>

<main class="max-w-2xl mx-auto p-6">
  <h1 class="title text-2xl font-bold amber mb-2">上架武器或道具</h1>
  <p class="text-iron text-sm mb-6">填完申請後，湯姆會審核，通過才會公開顯示。</p>

  <form method="post" enctype="multipart/form-data" class="card rounded-lg p-6">
    <div class="field">
      <label>商品名稱 *</label>
      <input name="title" required placeholder="例：泡棉長劍 90cm">
    </div>
    <div class="field">
      <label>商品描述</label>
      <textarea name="description" rows="4" placeholder="說明規格、狀態、適用場合..."></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="field">
        <label>價格 (TWD) *</label>
        <input name="price" type="number" required min="1" placeholder="例：1500">
      </div>
      <div class="field">
        <label>類別 *</label>
        <select name="category" required>
          <option value="weapon">武器</option>
          <option value="armor">盔甲</option>
          <option value="prop">道具</option>
          <option value="accessory">配件</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>狀態</label>
      <select name="condition">
        <option value="used">二手</option>
        <option value="like_new">幾乎全新</option>
        <option value="new">全新</option>
      </select>
    </div>
    <div class="field">
      <label>
        <input type="checkbox" name="is_overseas" class="mr-2">
        <span class="text-blue-300">🌏 這是海外商品（大陸/日本/其他）</span>
      </label>
    </div>
    <div class="field">
      <label>商品圖片</label>
      <input type="file" name="image" accept="image/*" class="bg-[#0d0b08] border border-[#3a2a1a] rounded px-3 py-2 text-sm w-full">
    </div>

    <hr class="border-[#2a2018] my-4">
    <p class="text-iron text-xs mb-3">以下資訊僅湯姆可見，不會公開</p>

    <div class="grid grid-cols-2 gap-4">
      <div class="field">
        <label>你的名字 *</label>
        <input name="seller_name" required placeholder="買家能看到">
      </div>
      <div class="field">
        <label>聯絡電話 *</label>
        <input name="seller_phone" required placeholder="私下聯繫用">
      </div>
    </div>
    <div class="field">
      <label>Email（選填）</label>
      <input name="seller_email" type="email" placeholder="選填">
    </div>

    <button type="submit" class="btn-primary w-full py-3 rounded font-bold text-lg mt-4">送出審核</button>
  </form>
</main>
</body>
</html>
