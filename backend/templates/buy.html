<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下訂金 - {{ item.title }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg-deep: #110e0a; --bg-card: #1c1610; --amber: #c8831a; --parchment: #e8dcc4; --iron: #8a7a6a; }
  body { background: var(--bg-deep); color: var(--parchment); font-family: 'Lora', serif; }
  h1,.title { font-family: 'Cinzel', serif; }
  .amber { color: var(--amber); }
  .btn-primary { background: var(--amber); color: #000; }
  .btn-primary:hover { background: #e09520; }
  .card { background: var(--bg-card); border: 1px solid #2a2018; }
  .text-iron { color: var(--iron); }
  input { background: #0d0b08; border: 1px solid #3a2a1a; color: var(--parchment); border-radius: 6px; padding: 8px 12px; width: 100%; }
  input:focus { outline: none; border-color: var(--amber); }
  label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--iron); }
  .field { margin-bottom: 16px; }
</style>
</head>
<body class="min-h-screen">
<nav class="border-b border-amber/30 bg-[#0d0b08] px-6 py-4">
  <a href="/" class="title text-xl font-bold amber">⚔ LARP 二手市集</a>
</nav>

<main class="max-w-lg mx-auto p-6">
  <div class="card rounded-lg p-6">
    <h1 class="title text-2xl font-bold amber mb-1">下訂金</h1>
    <p class="text-iron text-sm mb-4">{{ item.title }}</p>

    <div class="bg-[#1a1a0a] border border-amber/30 rounded p-4 mb-6 text-center">
      <div class="text-iron text-sm mb-1">訂金（50%）</div>
      <div class="title text-4xl font-bold amber">${{ (item.price * 0.5) | int }}</div>
      <div class="text-xs text-iron mt-1">總價 ${{ item.price }} · 手續費 10%</div>
    </div>

    <form method="post">
      <div class="grid grid-cols-2 gap-4">
        <div class="field">
          <label>你的名字 *</label>
          <input name="buyer_name" required>
        </div>
        <div class="field">
          <label>聯絡電話 *</label>
          <input name="buyer_phone" required>
        </div>
      </div>
      <div class="field">
        <label>Email（選填）</label>
        <input name="buyer_email" type="email">
      </div>

      <button type="submit" class="btn-primary w-full py-3 rounded font-bold text-lg mt-2">送出</button>
    </form>

    <p class="text-iron text-xs mt-4 text-center">送出後湯姆會通知你轉帳資訊。</p>
  </div>
</main>
</body>
</html>
