<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下訂金 - LARP 二手市集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#faf8f2;--card:#ffffff;--card-border:#e8e0d0;
--ink:#2d1f0e;--ink-light:#6b5a3e;
--green:#2d5a27;--green-light:#3d7a37;--green-pale:#d4e8c7;
--wine:#8b1a2d;--wine-light:#b5223a;
--gold:#c9891a;--cream:#f0e8d6;--dim:#9a8a72;
--shadow:rgba(45,31,14,0.08)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;min-height:100vh}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.afu{animation:fu .5s ease-out both}.afi{animation:fi .4s ease-out both}
.n{background:var(--card);border-bottom:2px solid var(--green);padding:1rem 2rem;box-shadow:0 2px 8px var(--shadow)}
.ni{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nl{font-family:Cormorant Garamond,serif;font-size:1.3rem;font-weight:700;color:var(--green);text-decoration:none;letter-spacing:.02em}
.links{display:flex;gap:2rem;list-style:none}
.links a{font-family:Cormorant Garamond,serif;font-size:.85rem;letter-spacing:.08em;color:var(--ink-light);text-decoration:none;padding-bottom:2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.links a:hover,.links a.active{color:var(--green);border-bottom-color:var(--green)}
.sd{display:flex;align-items:center;gap:1.2rem;margin:2.5rem 0 1.5rem}
.dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--card-border))}
.dt{font-family:Cormorant Garamond,serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.do{color:var(--green);font-size:.75rem}
.card{background:var(--card);border:1px solid var(--card-border);position:relative}
.card::before{content:;position:absolute;top:0;left:0;right:0;height:3px;background:var(--green);opacity:.6}
.cp{padding:1.5rem}
.item-title{font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:700;color:var(--ink);letter-spacing:.02em}
.price-tag{font-family:Cormorant Garamond,serif;font-size:1.6rem;font-weight:700;color:var(--green);letter-spacing:.02em}
.tag{display:inline-block;font-family:Cormorant Garamond,serif;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--green-pale);color:var(--green);padding:2px 8px;margin-right:.3rem}
.tag.overseas{background:#e8dff4;color:#5a3a8b}.tag.wine{background:#f8d7db;color:var(--wine)}
.btn-p{display:inline-block;font-family:Cormorant Garamond,serif;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;background:var(--green);color:#fff;border:none;padding:.8rem 2rem;text-decoration:none;transition:background .2s,transform .15s;cursor:pointer}
.btn-p:hover{background:var(--green-light);transform:translateY(-1px)}
.btn-o{display:inline-block;font-family:Cormorant Garamond,serif;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--green);border:1.5px solid var(--green);padding:.8rem 2rem;text-decoration:none;transition:background .2s,color .2s,transform .15s}
.btn-o:hover{background:var(--green);color:#fff;transform:translateY(-1px)}
.btn-w{display:inline-block;font-family:Cormorant Garamond,serif;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;background:var(--wine);color:#fff;border:none;padding:.8rem 2rem;text-decoration:none;transition:background .2s,transform .15s;cursor:pointer}
.btn-w:hover{background:var(--wine-light);transform:translateY(-1px)}
input,select,textarea{background:#fff;border:1.5px solid var(--card-border);color:var(--ink);padding:.6rem 1rem;font-family:Lora,serif;font-size:1rem;outline:none;transition:border-color .2s;width:100%;border-radius:2px}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none}
input::placeholder,textarea::placeholder{color:var(--dim);font-style:italic}
label{display:block;margin-bottom:.3rem;font-family:Cormorant Garamond,serif;font-size:.8rem;letter-spacing:.08em;color:var(--ink-light)}
.field{margin-bottom:1.2rem}hr{border:none;border-top:1px solid var(--card-border);margin:1.5rem 0}
.checkbox{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.checkbox input{width:auto}
.checkbox span{font-family:Lora,serif;color:var(--ink-light);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.2rem}
.ic{background:var(--card);border:1px solid var(--card-border);text-decoration:none;display:block;transition:box-shadow .25s,transform .25s,border-color .25s}
.ic:hover{box-shadow:0 6px 20px var(--shadow);transform:translateY(-3px);border-color:var(--green-light)}
.iw{width:100%;height:150px;overflow:hidden;background:#f5f0e8}
.iw img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.ic:hover .iw img{transform:scale(1.06)}
.ip{width:100%;height:150px;background:#f5f0e8;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--card-border);font-family:Cormorant Garamond,serif}
.ib{padding:.8rem}
.it{font-family:Cormorant Garamond,serif;font-size:.85rem;font-weight:700;color:var(--ink);margin-bottom:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip2{font-family:Cormorant Garamond,serif;font-size:1rem;font-weight:700;color:var(--green)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 80px);padding:2rem}
.login-box{background:var(--card);border:1px solid var(--card-border);padding:2.5rem;width:100%;max-width:420px;box-shadow:0 4px 24px var(--shadow);position:relative}
.login-box::before{content:;position:absolute;top:0;left:0;right:0;height:4px;background:var(--green)}
.flash{padding:.8rem 1.2rem;border-left:3px solid var(--green);background:var(--green-pale);color:var(--green);font-family:Lora,serif;font-style:italic;margin-bottom:1.5rem;animation:fu .4s ease-out}
.empty{text-align:center;padding:3rem;color:var(--dim);border:1px dashed var(--card-border);font-family:Lora,serif;font-style:italic;font-size:1rem;background:#fff}
.wish-card{background:#fff;border:1px solid var(--card-border);padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;border-left:3px solid var(--wine);transition:border-color .2s,box-shadow .2s}
.wish-card:hover{border-left-color:var(--green);box-shadow:0 2px 8px var(--shadow)}
.wn{font-family:Lora,serif;font-size:1rem;color:var(--ink);font-style:italic}
.wp{font-family:Cormorant Garamond,serif;font-size:.85rem;color:var(--dim);letter-spacing:.05em}
.meta{font-family:Lora,serif;font-size:.9rem;color:var(--dim);margin-top:.8rem;font-style:italic;border-top:1px solid var(--card-border);padding-top:.8rem}
.status{font-family:Cormorant Garamond,serif;font-size:.85rem;letter-spacing:.05em;margin-top:.4rem}
.status.y{color:#a07820}.status.b{color:#3a6a9f}.status.g{color:var(--green)}
.overseas-note{background:#f3edff;border-left:3px solid #7a50c0;padding:1rem 1.2rem;margin:1.2rem 0;font-style:italic;color:#5a3a8b;font-size:.95rem}
.ft{margin-top:5rem;padding:2.5rem 2rem;border-top:2px solid var(--green);text-align:center}
.ft p{font-family:Lora,serif;font-size:.85rem;color:var(--dim);font-style:italic}
.section-title{font-family:Cormorant Garamond,serif;font-size:1.1rem;font-weight:700;color:var(--ink);letter-spacing:.08em;margin-bottom:1.5rem;border-bottom:1px solid var(--card-border);padding-bottom:.5rem}
.deposit-box{background:#fff8e8;border:1.5px solid #d4a820;padding:1.2rem;text-align:center;margin:1.5rem 0}
.deposit-price{font-family:Cormorant Garamond,serif;font-size:2.5rem;font-weight:700;color:#a07820}
@media(max-width:640px){.links{gap:1rem}.links a{font-size:.8rem}.grid{grid-template-columns:repeat(2,1fr);gap:.8rem}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px}

</style>
</head>
<body>
<nav class="n">
  <div class="ni">
    <a href="/" class="nl">&#9876; LARP 二手市集</a>
    <ul class="links">
      <li><a href="/market">市集</a></li>
      <li><a href="/wishlist">許願區</a></li>
      <li><a href="/list">上架</a></li>
      <li><a href="/about">關於</a></li>
    </ul>
  </div>
</nav>

<main style="max-width:520px;margin:0 auto;padding:0 2rem 3rem;">
  <div class="sd afu"><div class="dl"></div><span class="dt">下訂金</span><span class="do">&#10022;</span><span class="dt">Deposit</span><div class="dl"></div></div>
  <div class="card cp">
    <h1 style="font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:700;color:var(--ink);margin-bottom:.3rem;" class="afu">{{ item.title }}</h1>
    <div class="deposit-box">
      <div style="font-family:Cormorant Garamond,serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:.4rem;">訂金（50%）</div>
      <div class="deposit-price">${{ (item.price * 0.5) | int }}</div>
      <div style="font-family:Cormorant Garamond,serif;font-size:.7rem;color:var(--dim);margin-top:.4rem;">總價 ${{ item.price }} · 手續費 10%</div>
    </div>
    <form method="post">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="field">
          <label>你的名字 *</label>
          <input name="buyer_name" required>
        </div>
        <div class="field">
          <label>電話 *</label>
          <input name="buyer_phone" required>
        </div>
      </div>
      <div class="field">
        <label>Email（選填）</label>
        <input name="buyer_email" type="email">
      </div>
      <button type="submit" class="btn-w" style="width:100%;">送出</button>
      <p style="text-align:center;color:var(--dim);font-family:Lora,serif;font-style:italic;font-size:.9rem;margin-top:.8rem;">送出後湯姆會通知你轉帳資訊</p>
    </form>
  </div>
</main>
<footer class="ft"><p>LARP 二手市集 — 每週三林森公園夜貓聚會面交</p></footer>
</body>
</html>
